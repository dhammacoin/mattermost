name: Samantha-Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'

      - name: Surgical Removal
        run: |
          cd server
          # Удаляем файлы, которые требуют ReviewerIDsSettings
          rm -rf channels/app/content_flagging.go
          rm -rf channels/app/content_flagging_test.go
          rm -rf channels/store/sqlstore/content_flagging_store.go
          
          # Очищаем интерфейс в store.go, чтобы он не ссылался на удаленные функции
          # Просто удаляем строки между началом и концом интерфейса ContentFlaggingStore
          sed -i '/type ContentFlaggingStore interface {/,/}/c\type ContentFlaggingStore interface {}' channels/store/store.go

      - name: Build Mattermost
        run: |
          cd server
          # Исправляем зависимости под наш replace
          go mod tidy
          # Собираем
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags 'team,production' -v -o ../mattermost_samantha ./cmd/mattermost

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mattermost_samantha
          path: mattermost_samantha