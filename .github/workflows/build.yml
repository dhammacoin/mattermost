name: Samantha-Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'

      - name: Prepare Local Model
        run: |
          cd server
          # Создаем папку, на которую ссылается go.mod
          mkdir -p public/model
          # Генерируем файл-заглушку
          cat <<EOF > public/model/samantha_stub.go
          package model
          type ReviewerIDsSettings struct {
              ReviewerIDs    []string \`json:"reviewer_ids"\`
              ReviewerGroups []string \`json:"reviewer_groups"\`
          }
          EOF
          echo "Stub created in server/public/model/"

      - name: Build Mattermost
        run: |
          cd server
          # Мы НЕ делаем go mod tidy, чтобы он не удалил наши replace
          # Собираем напрямую
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags 'team,production' -v -o ../mattermost_samantha ./cmd/mattermost

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mattermost_samantha
          path: mattermost_samantha