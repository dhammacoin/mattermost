name: Samantha-Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.6' # Соответствует твоему go.mod

      - name: Build Mattermost
        run: |
          cd server
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags 'team,production' -v -o ../mattermost_samantha ./cmd/mattermost

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mattermost_samantha
          path: mattermost_samantha