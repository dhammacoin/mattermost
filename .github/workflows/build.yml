name: Samantha-Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false # Отключаем кэш, чтобы избежать старых ошибок

      - name: Inject Samantha Stub
        run: |
          # Создаем папку вглубине структуры
          mkdir -p server/public/model
          # Генерируем файл напрямую
          cat <<EOF > server/public/model/samantha_stub.go
          package model
          type ReviewerIDsSettings struct {
              ReviewerIDs    []string \`json:"reviewer_ids"\`
              ReviewerGroups []string \`json:"reviewer_groups"\`
          }
          EOF
          # Проверяем, что файл на месте (увидим в логах)
          ls -R server/public/model/

      - name: Build Mattermost
        run: |
          cd server
          # Запускаем сборку с отключенным CGO для надежности
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags 'team,production' -v -o ../mattermost_samantha ./cmd/mattermost

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mattermost_samantha
          path: mattermost_samantha