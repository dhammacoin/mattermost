name: Samantha-Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false # Отключаем кэш, чтобы избежать старых ошибок

      - name: Force Inject Enterprise Types
        run: |
          # Переходим туда, где лежат модели
          cd server/public/model
          
          # Вставляем структуру прямо в существующий файл config.go
          # Мы добавляем её в конец файла. config.go есть в любой версии Mattermost.
          echo -e "\ntype ReviewerIDsSettings struct {\n    ReviewerIDs    []string \`json:\"reviewer_ids\"\` \n    ReviewerGroups []string \`json:\"reviewer_groups\"\` \n}" >> config.go
          
          # Проверяем, что оно там появилось (для логов)
          tail -n 10 config.go

      - name: Build Mattermost
        run: |
          cd server
          # Запускаем сборку с отключенным CGO для надежности
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags 'team,production' -v -o ../mattermost_samantha ./cmd/mattermost

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mattermost_samantha
          path: mattermost_samantha