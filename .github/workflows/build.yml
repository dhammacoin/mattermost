name: Samantha-Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'

      - name: Hard-Inject Stub
        run: |
          # Вставляем тип прямо в существующий официальный файл модели
          # Это гарантирует, что тип будет виден всем частям сервера
          cd server/public/model
          echo -e "\ntype ReviewerIDsSettings struct {\n    ReviewerIDs    []string \`json:\"reviewer_ids\"\` \n    ReviewerGroups []string \`json:\"reviewer_groups\"\` \n}" >> config.go
          echo "Stub injected into config.go"

      - name: Build
        run: |
          cd server
          # Собираем напрямую, игнорируя попытки go mod tidy удалить наши правки
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags 'team,production' -v -o ../mattermost_samantha ./cmd/mattermost

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mattermost_samantha
          path: mattermost_samantha