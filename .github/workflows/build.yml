name: Samantha-Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'

      - name: Kill the problematic type
        run: |
          cd server
          # Удаляем упоминание ReviewerIDsSettings из всех файлов, чтобы Go не искал этот тип
          find . -name "*.go" -exec sed -i 's/model.ReviewerIDsSettings/interface{}/g' {} +
          find . -name "*.go" -exec sed -i 's/ReviewerIDsSettings/interface{}/g' {} +
          # Теперь Go будет думать, что там просто пустой интерфейс

      - name: Build Mattermost
        run: |
          cd server
          # Собираем без проверки зависимостей, так как мы "сломали" типы
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags 'team,production' -o ../mattermost_samantha ./cmd/mattermost

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mattermost_samantha
          path: mattermost_samantha